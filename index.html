<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ayya ♥️🤲</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff5f8;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        header {
            width: 100%;
            background-color: #ffb7c5;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; color: white; font-size: 24px; }
        .content {
            flex: 1;
            width: 90%;
            max-width: 900px;
            margin: 20px 0;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        /* Menggunakan tag object sebagai alternatif iframe agar lebih stabil */
        object {
            width: 100%;
            height: 100%;
        }
        footer { margin-bottom: 10px; color: #ff8da1; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>ayya ♥️🤲</h1>
    </header>

    <div class="content">
        <object data="almatsurat.pdf" type="application/pdf">
            <embed src="almatsurat.pdf" type="application/pdf" />
            <p>PDF tidak muncul? <a href="almatsurat.pdf">Klik di sini untuk mendownload</a></p>
        </object>
    </div>

    <footer>Dzikir Pagi & Petang</footer>

</body>
</html>
